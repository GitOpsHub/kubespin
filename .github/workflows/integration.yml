name: Integration

# Integration tests touch real AWS and a local Postgres, so they run nightly and
# on demand rather than on every pull request.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC only: no long-lived cloud credentials in this repo

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: integration

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      # Configured once the fleet AWS account exists (see infra/fleet/README.md).
      # Until then the Postgres-backed registry tests below run without it.
      - name: Configure AWS credentials
        if: vars.AWS_INTEGRATION_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_INTEGRATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Integration tests
        env:
          KUBESPIN_POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: go test -race -tags=integration -timeout 30m ./...
